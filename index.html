<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mizuiku</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://i.postimg.cc/d01s2X3T/MIzuiku.png">
  <link rel="shortcut icon" type="image/png" href="https://i.postimg.cc/d01s2X3T/MIzuiku.png">
  
  <!-- PWA & Apple Mobile Web App Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#E0F2FE">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mizuiku">
  <link rel="apple-touch-icon" href="https://i.postimg.cc/d01s2X3T/MIzuiku.png">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Google Font: Mali -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mali:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root {
      /* Bright Blue & White Theme */
      --bg-sky-top: #F0F9FF;
      --bg-sky-mid: #E0F2FE;
      --bg-sky-bottom: #BAE6FD;
      
      --bg-card: rgba(255, 255, 255, 0.96);
      --bg-card-hover: #FFFFFF;
      
      --text-main: #0F172A; /* High-contrast slate navy */
      --text-sub: #0369A1; /* Ocean deep blue */
      --text-muted: #64748B; /* Soft slate */
      
      --water-primary: #0284C7; /* Azure Blue */
      --water-vivid: #0EA5E9; /* Sky Water */
      --water-cyan: #38BDF8; /* Crystal Cyan */
      --water-light: #E0F2FE;
      --nature-mint: #10B981;
      --sun-gold: #F59E0B;
      --danger: #EF4444;
      
      --border-water: rgba(56, 189, 248, 0.35);
      --border-hover: #0EA5E9;
      --glow-water: rgba(14, 165, 233, 0.22);
      
      --shadow-water: 0 8px 20px -4px rgba(14, 165, 233, 0.12), 0 4px 8px -2px rgba(14, 165, 233, 0.06);
      --shadow-hover: 0 16px 30px -6px rgba(14, 165, 233, 0.25), 0 0 16px 2px rgba(56, 189, 248, 0.22);
      
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Mali', cursive, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(180deg, #F0F9FF 0%, #E0F2FE 45%, #BAE6FD 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }

    /* Ambient Water Background Glows */
    .nature-bg-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .water-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
      animation: floatOrb 18s ease-in-out infinite alternate;
    }

    .water-orb-1 {
      width: 480px;
      height: 480px;
      top: -120px;
      right: -80px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.35), rgba(186, 230, 253, 0.15));
    }

    .water-orb-2 {
      width: 550px;
      height: 550px;
      bottom: -150px;
      left: -120px;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.25), rgba(224, 242, 254, 0.2));
      animation-duration: 22s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, 25px) scale(1.08); }
      100% { transform: translate(-25px, 40px) scale(0.95); }
    }

    .nature-waves {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 140px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.65;
    }

    /* ============================================================
       LOADING SCREEN OVERLAY (ข้อความ: "กำลังโหลดข้อมูล")
       ============================================================ */
    .nature-loader-overlay {
      position: fixed;
      inset: 0;
      z-index: 3000;
      background: rgba(240, 249, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .nature-loader-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .nature-loader-box {
      background: #FFFFFF;
      border: 1.5px solid var(--water-cyan);
      box-shadow: 0 16px 40px -8px rgba(14, 165, 233, 0.25), 0 0 30px rgba(56, 189, 248, 0.3);
      border-radius: 28px;
      padding: 32px 38px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      max-width: 90vw;
      width: 290px;
      transform: scale(0.95);
      transition: transform 0.25s ease;
    }

    .nature-loader-overlay.active .nature-loader-box {
      transform: scale(1);
    }

    .loader-icon-container {
      position: relative;
      width: 76px;
      height: 76px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .water-ripple-ring {
      position: absolute;
      inset: -8px;
      border: 2.5px solid var(--water-vivid);
      border-radius: 50%;
      animation: ripplePulse 2s ease-out infinite;
      opacity: 0;
    }

    .water-ripple-ring.ring-2 {
      animation-delay: 1s;
    }

    @keyframes ripplePulse {
      0% { transform: scale(0.7); opacity: 0.9; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    .loader-logo-img {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      object-fit: cover;
      box-shadow: 0 6px 16px rgba(14, 165, 233, 0.35);
      z-index: 2;
      animation: gentleFloat 2.5s ease-in-out infinite alternate;
    }

    @keyframes gentleFloat {
      0% { transform: translateY(0); }
      100% { transform: translateY(-5px); }
    }

    .loader-text {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
    }

    /* ============================================================
       HEADER (Strict Single-Line on Mobile, Brand Title Only, No Date)
       ============================================================ */
    header.mizuiku-header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: rgba(255, 255, 255, 0.90);
      border-bottom: 1.5px solid rgba(56, 189, 248, 0.28);
      padding: 10px 18px;
      box-shadow: 0 4px 18px rgba(14, 165, 233, 0.08);
      transition: all 0.25s ease;
    }

    .header-container {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      flex-shrink: 0;
      user-select: none;
      cursor: pointer;
    }

    .brand-logo-wrap {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: #FFFFFF;
      border: 1.5px solid var(--water-cyan);
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      transition: transform 0.3s ease;
    }

    .brand-logo-wrap:hover {
      transform: scale(1.08) rotate(4deg);
    }

    .brand-logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .brand-text-block {
      display: flex;
      align-items: center;
      white-space: nowrap;
    }

    .brand-title {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #0284C7 0%, #0EA5E9 60%, #0369A1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
    }

    .header-tools {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: nowrap;
    }

    /* Admin Role Pill Button */
    .role-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid var(--border-water);
      background: #FFFFFF;
      color: var(--text-sub);
      box-shadow: 0 2px 8px rgba(14, 165, 233, 0.08);
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .role-btn:hover {
      border-color: var(--water-vivid);
      color: var(--water-primary);
      box-shadow: 0 0 12px var(--glow-water);
    }

    .role-btn.admin-active {
      background: linear-gradient(135deg, #0284C7 0%, #0EA5E9 100%);
      border-color: #38BDF8;
      color: #FFFFFF;
      box-shadow: 0 4px 14px rgba(14, 165, 233, 0.35);
    }

    .btn-icon-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border-water);
      background: #FFFFFF;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.95rem;
      box-shadow: 0 2px 8px rgba(14, 165, 233, 0.08);
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .btn-icon-circle:hover {
      background: var(--water-light);
      border-color: var(--water-vivid);
      color: var(--water-primary);
    }

    /* ============================================================
       MAIN CONTENT CONTAINER
       ============================================================ */
    main.mizuiku-main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 16px 80px 16px;
      position: relative;
      z-index: 1;
    }

    /* Admin Action Toolbar (Visible ONLY in Admin Mode) */
    .admin-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.85);
      border: 1px dashed var(--border-water);
      border-radius: 16px;
      backdrop-filter: blur(8px);
    }

    .admin-info-hint {
      font-size: 0.82rem;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }

    .btn-water-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #0284C7 0%, #0EA5E9 100%);
      border: 1px solid #38BDF8;
      color: #FFFFFF;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(14, 165, 233, 0.3);
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-water-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(14, 165, 233, 0.4);
      background: linear-gradient(135deg, #0369A1 0%, #0284C7 100%);
    }

    /* ============================================================
       COMPACT APP LAUNCHER GRID (เน้น Icon และ Name ไม่กว้างเกินไป)
       ============================================================ */
    .apps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 150px));
      gap: 20px 16px;
      justify-content: center;
      margin-top: 10px;
    }

    .app-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-water);
      border-radius: 20px;
      padding: 16px 10px 14px 10px;
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow-water);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      position: relative;
      user-select: none;
      min-height: 135px;
    }

    .app-card:hover {
      transform: translateY(-5px);
      border-color: var(--border-hover);
      box-shadow: var(--shadow-hover);
      background: var(--bg-card-hover);
    }

    .app-card.maintenance-card {
      opacity: 0.7;
      border-color: rgba(245, 158, 11, 0.45);
    }

    /* Drag & Drop Reorder Styles */
    .app-card.is-dragging {
      opacity: 0.45;
      transform: scale(0.95);
      border: 2px dashed var(--water-primary);
    }

    .app-card.drag-over {
      border: 2px solid var(--water-vivid);
      box-shadow: 0 0 20px var(--glow-water);
      transform: scale(1.05);
    }

    /* Prominent App Icon */
    .app-icon-frame {
      width: 66px;
      height: 66px;
      border-radius: 18px;
      background: #FFFFFF;
      border: 1.5px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 6px 16px rgba(14, 165, 233, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 10px;
      position: relative;
      transition: transform 0.25s ease;
      flex-shrink: 0;
    }

    .app-card:hover .app-icon-frame {
      transform: scale(1.08);
      box-shadow: 0 8px 20px rgba(14, 165, 233, 0.28);
    }

    .app-icon-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .app-icon-frame .fallback-icon {
      font-size: 1.6rem;
      color: var(--water-primary);
      font-weight: 700;
    }

    /* Clean App Title (No Description, No Category) */
    .app-name {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
      max-width: 100%;
      padding: 0 2px;
    }

    /* Admin Action Buttons on Card */
    .admin-card-actions {
      position: absolute;
      top: 6px;
      right: 6px;
      display: flex;
      gap: 4px;
      z-index: 5;
    }

    .admin-icon-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid var(--border-water);
      background: rgba(255, 255, 255, 0.95);
      color: var(--text-sub);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      transition: all 0.2s ease;
    }

    .admin-icon-btn:hover {
      background: var(--water-vivid);
      color: #FFFFFF;
      border-color: var(--water-vivid);
      transform: scale(1.1);
    }

    .admin-icon-btn.del:hover {
      background: var(--danger);
      color: #FFFFFF;
      border-color: var(--danger);
    }

    .drag-grip-indicator {
      position: absolute;
      top: 6px;
      left: 6px;
      width: 20px;
      height: 20px;
      color: var(--water-cyan);
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      opacity: 0.75;
    }

    .drag-grip-indicator:active {
      cursor: grabbing;
    }

    /* ============================================================
       EMPTY STATE
       ============================================================ */
    .empty-state-card {
      background: rgba(255, 255, 255, 0.92);
      border: 2px dashed rgba(56, 189, 248, 0.5);
      border-radius: 26px;
      padding: 45px 24px;
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow-water);
      max-width: 500px;
      margin: 40px auto;
      position: relative;
    }

    .empty-icon-wrap {
      width: 80px;
      height: 80px;
      margin: 0 auto 16px auto;
      border-radius: 22px;
      background: #FFFFFF;
      border: 2px solid var(--water-cyan);
      box-shadow: 0 8px 24px rgba(14, 165, 233, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .empty-icon-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .empty-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #0F172A;
      margin-bottom: 6px;
    }

    .empty-desc {
      font-size: 0.88rem;
      color: var(--text-sub);
      line-height: 1.5;
      margin-bottom: 20px;
    }

    /* ============================================================
       IN-APP FULLSCREEN WEB APP VIEWER
       ============================================================ */
    .viewer-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: #0F172A;
      display: none;
      flex-direction: column;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .viewer-overlay.active {
      display: flex;
      opacity: 1;
    }

    .viewer-toolbar {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1010;
      background: rgba(255, 255, 255, 0.95);
      border: 1.5px solid var(--water-cyan);
      box-shadow: 0 8px 30px rgba(14, 165, 233, 0.3);
      border-radius: 30px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      max-width: 95vw;
    }

    .viewer-app-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-right: 8px;
      border-right: 1px solid rgba(56, 189, 248, 0.35);
      white-space: nowrap;
      max-width: 180px;
      overflow: hidden;
    }

    .viewer-app-badge img {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      object-fit: cover;
    }

    .viewer-app-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #0F172A;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .viewer-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid rgba(56, 189, 248, 0.4);
      background: #FFFFFF;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.88rem;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .viewer-btn:hover {
      background: var(--water-vivid);
      color: #FFFFFF;
    }

    .viewer-btn.close {
      background: #FEE2E2;
      border-color: #FCA5A5;
      color: #EF4444;
    }

    .viewer-btn.close:hover {
      background: var(--danger);
      color: #FFFFFF;
    }

    .viewer-iframe-wrap {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      background: #FFFFFF;
    }

    .viewer-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .viewer-loading-screen {
      position: absolute;
      inset: 0;
      background: #F0F9FF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 5;
      transition: opacity 0.3s ease;
    }

    .water-ripple-spinner {
      width: 48px;
      height: 48px;
      border: 3.5px solid rgba(56, 189, 248, 0.25);
      border-top-color: var(--water-vivid);
      border-radius: 50%;
      animation: spinRipple 0.8s linear infinite;
    }

    @keyframes spinRipple {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* ============================================================
       MODAL: ADD / EDIT APP (Auto Favicon, No Category)
       ============================================================ */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .modal-backdrop.active {
      display: flex;
      opacity: 1;
    }

    .modal-dialog {
      background: #FFFFFF;
      border: 1.5px solid var(--water-cyan);
      box-shadow: 0 20px 50px -10px rgba(14, 165, 233, 0.35);
      border-radius: 26px;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      position: relative;
      transform: scale(0.94);
      transition: transform 0.25s ease;
      color: var(--text-main);
    }

    .modal-backdrop.active .modal-dialog {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1.5px solid rgba(56, 189, 248, 0.25);
    }

    .modal-title {
      font-size: 1.18rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.25rem;
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .modal-close-btn:hover {
      background: #FEE2E2;
      color: var(--danger);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      background: #F8FAFC;
      border: 1.5px solid rgba(56, 189, 248, 0.4);
      border-radius: 12px;
      padding: 10px 14px;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--water-vivid);
      box-shadow: 0 0 12px var(--glow-water);
      background: #FFFFFF;
    }

    .favicon-preview-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
      padding: 8px 12px;
      background: #F0F9FF;
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 12px;
    }

    .favicon-preview-img {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      object-fit: cover;
      background: #FFFFFF;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .favicon-preview-text {
      font-size: 0.78rem;
      color: var(--text-sub);
      font-weight: 500;
    }

    /* ============================================================
       PIN MODAL
       ============================================================ */
    .pin-display-wrap {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 20px 0 24px 0;
    }

    .pin-circle {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid var(--water-vivid);
      background: transparent;
      transition: all 0.2s ease;
    }

    .pin-circle.filled {
      background: var(--water-vivid);
      box-shadow: 0 0 10px var(--glow-water);
    }

    .pin-keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 280px;
      margin: 0 auto;
    }

    .pin-key {
      height: 50px;
      border-radius: 14px;
      border: 1.5px solid rgba(56, 189, 248, 0.35);
      background: #F8FAFC;
      color: #0F172A;
      font-size: 1.3rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      user-select: none;
    }

    .pin-key:hover {
      background: #E0F2FE;
      border-color: var(--water-vivid);
      color: var(--water-primary);
    }

    .pin-key:active {
      transform: scale(0.92);
      background: var(--water-vivid);
      color: #FFFFFF;
    }

    /* Toast Notification */
    .nature-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #FFFFFF;
      border: 1.5px solid var(--water-vivid);
      box-shadow: 0 10px 30px rgba(14, 165, 233, 0.25);
      border-radius: 30px;
      padding: 10px 22px;
      color: #0F172A;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 4000;
      pointer-events: none;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }

    .nature-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* ============================================================
       MOBILE RESPONSIVENESS
       ============================================================ */
    @media (max-width: 768px) {
      header.mizuiku-header {
        padding: 8px 12px;
      }

      .brand-title {
        font-size: 1.15rem;
      }

      .brand-logo-wrap {
        width: 34px;
        height: 34px;
      }

      .role-btn span.role-text {
        display: none;
      }

      .role-btn {
        padding: 6px 10px;
      }

      .apps-grid {
        grid-template-columns: repeat(auto-fill, minmax(105px, 130px));
        gap: 16px 12px;
      }

      .app-card {
        padding: 14px 8px 12px 8px;
        min-height: 125px;
      }

      .app-icon-frame {
        width: 58px;
        height: 58px;
        border-radius: 15px;
      }

      .app-name {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient Light Blue Water Background Layer -->
  <div class="nature-bg-layer">
    <div class="water-orb water-orb-1"></div>
    <div class="water-orb water-orb-2"></div>
    <svg class="nature-waves" viewBox="0 0 1440 140" fill="none" preserveAspectRatio="none">
      <path d="M0,64 C320,120 420,0 720,48 C1020,96 1120,24 1440,64 L1440,140 L0,140 Z" fill="rgba(56, 189, 248, 0.15)"></path>
      <path d="M0,80 C360,20 600,100 900,50 C1200,0 1320,80 1440,80 L1440,140 L0,140 Z" fill="rgba(14, 165, 233, 0.12)"></path>
    </svg>
  </div>

  <!-- ============================================================
       FULL SCREEN LOADER (ข้อความ: "กำลังโหลดข้อมูล")
       ============================================================ */ -->
  <div class="nature-loader-overlay active" id="mizuikuLoader">
    <div class="nature-loader-box">
      <div class="loader-icon-container">
        <div class="water-ripple-ring"></div>
        <div class="water-ripple-ring ring-2"></div>
        <img src="https://i.postimg.cc/d01s2X3T/MIzuiku.png" alt="Mizuiku" class="loader-logo-img">
      </div>
      <div class="loader-text">กำลังโหลดข้อมูล</div>
    </div>
  </div>

  <!-- ============================================================
       HEADER (Single-Line on Mobile, Brand Title Only, No Date)
       ============================================================ -->
  <header class="mizuiku-header">
    <div class="header-container">
      
      <!-- Brand & Logo (Title only: Mizuiku) -->
      <div class="brand-section" onclick="window.scrollTo({top:0, behavior:'smooth'})">
        <div class="brand-logo-wrap">
          <img src="https://i.postimg.cc/d01s2X3T/MIzuiku.png" alt="Mizuiku Logo" class="brand-logo-img">
        </div>
        <div class="brand-text-block">
          <div class="brand-title">Mizuiku</div>
        </div>
      </div>

      <!-- Right Header Tools -->
      <div class="header-tools">
        
        <!-- Admin Mode Switcher -->
        <button class="role-btn" id="roleBtn" onclick="toggleRole()" title="สลับโหมดผู้ดูแลระบบ">
          <i class="bi bi-shield-lock" id="roleIcon"></i>
          <span class="role-text" id="roleText">แอดมิน</span>
        </button>

        <!-- Install PWA Button -->
        <button class="btn-icon-circle" id="installPwaBtn" onclick="handlePwaInstall()" style="display: none;" title="ติดตั้งแอปลงเครื่อง">
          <i class="bi bi-download"></i>
        </button>

      </div>

    </div>
  </header>

  <!-- ============================================================
       MAIN CONTENT (No Search Bar, Clean App Launcher Layout)
       ============================================================ -->
  <main class="mizuiku-main">
    
    <!-- Admin Top Action Toolbar (Visible ONLY in Admin Mode) -->
    <div class="admin-top-bar" id="adminTopBar" style="display: none;">
      <div class="admin-info-hint">
        <i class="bi bi-grip-vertical" style="color: var(--water-primary); font-size: 1rem;"></i>
        <span>โหมดจัดการระบบ (สามารถลากไอคอนเพื่อจัดเรียงลำดับแอปได้)</span>
      </div>
      <button class="btn-water-primary" onclick="openAddAppModal()">
        <i class="bi bi-plus-lg"></i>
        <span>เพิ่มเว็บแอป</span>
      </button>
    </div>

    <!-- Apps Grid / Empty State -->
    <div id="appsContainer">
      <!-- Injected via JavaScript -->
    </div>

  </main>

  <!-- ============================================================
       IN-APP FULLSCREEN WEB APP VIEWER
       ============================================================ -->
  <div class="viewer-overlay" id="viewerOverlay">
    
    <div class="viewer-toolbar">
      <div class="viewer-app-badge">
        <img id="viewerAppIcon" src="" alt="icon">
        <span class="viewer-app-title" id="viewerAppTitle">Web App</span>
      </div>

      <button class="viewer-btn" onclick="closeViewer()" title="กลับหน้าหลัก Mizuiku">
        <i class="bi bi-house-door-fill"></i>
      </button>

      <button class="viewer-btn" onclick="reloadViewer()" title="รีเฟรชหน้าเว็บ">
        <i class="bi bi-arrow-clockwise"></i>
      </button>

      <button class="viewer-btn" onclick="toggleViewerFullscreen()" title="สลับเต็มจอ">
        <i class="bi bi-arrows-fullscreen"></i>
      </button>

      <button class="viewer-btn" onclick="openViewerExternal()" title="เปิดในแท็บเบราว์เซอร์ใหม่">
        <i class="bi bi-box-arrow-up-right"></i>
      </button>

      <button class="viewer-btn close" onclick="closeViewer()" title="ปิด">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="viewer-iframe-wrap">
      <div class="viewer-loading-screen" id="viewerLoader">
        <div class="water-ripple-spinner"></div>
        <div style="font-size: 0.95rem; font-weight: 600; color: #0284C7;">กำลังโหลดข้อมูล</div>
      </div>
      <iframe class="viewer-iframe" id="viewerIframe" src="about:blank" allow="camera; microphone; geolocation; fullscreen; clipboard-read; clipboard-write;" onload="onIframeLoaded()"></iframe>
    </div>

  </div>

  <!-- ============================================================
       MODAL: ADD / EDIT APP (Automatic Favicon Detection, No Category)
       ============================================================ -->
  <div class="modal-backdrop" id="appModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <div class="modal-title" id="appModalTitle">
          <i class="bi bi-plus-circle" style="color: var(--water-primary);"></i>
          <span>เพิ่มเว็บแอปใหม่</span>
        </div>
        <button class="modal-close-btn" onclick="closeAppModal()">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>

      <form id="appForm" onsubmit="handleAppFormSubmit(event)">
        <input type="hidden" id="formAppId">

        <div class="form-group">
          <label class="form-label">ชื่อเว็บแอป *</label>
          <input type="text" class="form-input" id="formAppName" placeholder="เช่น ระบบห้องสมุด, บันทึกการเงิน" required>
        </div>

        <div class="form-group">
          <label class="form-label">URL ลิงก์เข้าใช้งาน *</label>
          <input type="url" class="form-input" id="formAppUrl" placeholder="https://..." required oninput="previewAutoFavicon(this.value)">
          <div class="favicon-preview-wrap" id="faviconPreviewWrap">
            <img id="faviconPreviewImg" src="https://i.postimg.cc/d01s2X3T/MIzuiku.png" alt="Favicon" class="favicon-preview-img">
            <div class="favicon-preview-text">ระบบจะดึง Favicon ของเว็บแอปให้อัตโนมัติ</div>
          </div>
        </div>

        <div class="form-group" style="display: flex; align-items: center; justify-content: space-between; margin-top: 14px;">
          <label class="form-label" style="margin-bottom: 0;">สถานะการใช้งาน</label>
          <label style="display: flex; align-items: center; gap: 8px; font-size: 0.88rem; cursor: pointer;">
            <input type="checkbox" id="formAppActive" checked style="accent-color: var(--water-primary); width: 18px; height: 18px;">
            <span>เปิดใช้งานปกติ</span>
          </label>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 24px;">
          <button type="button" class="btn-icon-circle" style="flex: 1; width: auto; border-radius: 12px; font-weight: 600;" onclick="closeAppModal()">ยกเลิก</button>
          <button type="submit" class="btn-water-primary" style="flex: 1.5; justify-content: center;">บันทึกข้อมูล</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ============================================================
       MODAL: PIN KEYPAD (Admin Security)
       ============================================================ -->
  <div class="modal-backdrop" id="pinModal">
    <div class="modal-dialog" style="max-width: 360px;">
      <div class="modal-header">
        <div class="modal-title">
          <i class="bi bi-shield-lock" style="color: var(--water-primary);"></i>
          <span>รหัสผ่านแอดมิน</span>
        </div>
        <button class="modal-close-btn" onclick="closePinModal()">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>

      <div style="text-align: center;">
        <p style="font-size: 0.88rem; color: var(--text-sub); margin-bottom: 8px;">กรุณากรอกรหัส PIN 4 หลักเพื่อเข้าสู่โหมดจัดการระบบ</p>
        
        <div class="pin-display-wrap">
          <div class="pin-circle" id="pinDot0"></div>
          <div class="pin-circle" id="pinDot1"></div>
          <div class="pin-circle" id="pinDot2"></div>
          <div class="pin-circle" id="pinDot3"></div>
        </div>

        <div class="pin-keypad">
          <button type="button" class="pin-key" onclick="pressPin('1')">1</button>
          <button type="button" class="pin-key" onclick="pressPin('2')">2</button>
          <button type="button" class="pin-key" onclick="pressPin('3')">3</button>
          <button type="button" class="pin-key" onclick="pressPin('4')">4</button>
          <button type="button" class="pin-key" onclick="pressPin('5')">5</button>
          <button type="button" class="pin-key" onclick="pressPin('6')">6</button>
          <button type="button" class="pin-key" onclick="pressPin('7')">7</button>
          <button type="button" class="pin-key" onclick="pressPin('8')">8</button>
          <button type="button" class="pin-key" onclick="pressPin('9')">9</button>
          <button type="button" class="pin-key" onclick="clearPin()" style="font-size: 0.9rem; color: var(--text-muted);">ล้าง</button>
          <button type="button" class="pin-key" onclick="pressPin('0')">0</button>
          <button type="button" class="pin-key" onclick="backspacePin()" style="font-size: 1.15rem; color: var(--water-primary);"><i class="bi bi-backspace"></i></button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============================================================
       TOAST NOTIFICATION
       ============================================================ -->
  <div class="nature-toast" id="toast">
    <i class="bi bi-check-circle-fill" style="color: var(--water-primary); font-size: 1.1rem;"></i>
    <span id="toastMsg">ข้อความแจ้งเตือน</span>
  </div>

  <!-- ============================================================
       APPLICATION LOGIC SCRIPT
       ============================================================ -->
  <script>
    // ============================================================
    // CONFIGURATION & STATE
    // ============================================================
    const STORAGE_KEY = 'mizuiku_apps_data_v2';
    const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbznuwVPbNJ-QZyKqpJayU2XAIpFrT-FhYzXqaSFyzDdYziPmZiNI-936rHR4oV6FVpT/exec';
    const ADMIN_PIN_KEY = 'mizuiku_admin_pin';
    const DEFAULT_PIN = '8055';

    let currentRole = 'guest'; // 'guest' | 'admin'
    let enteredPin = '';
    let deferredPrompt = null;
    let currentViewerApp = null;
    let isFetchingCloud = false;
    let isSavingCloud = false;

    // Drag & Drop state
    let draggedAppId = null;
    let touchStartX = 0;
    let touchStartY = 0;
    let touchActiveCard = null;
    let touchActiveId = null;
    let isDraggingTouch = false;

    // ============================================================
    // INITIALIZATION
    // ============================================================
    document.addEventListener('DOMContentLoaded', async () => {
      renderApps();
      initPwaEvents();

      showLoader();
      try {
        await Promise.race([
          fetchAppsFromCloud(true),
          new Promise(resolve => setTimeout(resolve, 2000))
        ]);
      } catch (err) {
        console.warn('Initial cloud sync error:', err);
      } finally {
        hideLoader();
      }
    });

    // Background Auto-Sync: Poll every 4 seconds
    setInterval(() => {
      fetchAppsFromCloud(false);
    }, 4000);

    // Multi-Device Auto-Sync on Tab Focus & Visibility Change
    window.addEventListener('focus', () => fetchAppsFromCloud(false));
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        fetchAppsFromCloud(false);
      }
    });

    // ============================================================
    // LOADER HELPERS (ข้อความ: "กำลังโหลดข้อมูล")
    // ============================================================
    function showLoader() {
      const loader = document.getElementById('mizuikuLoader');
      if (loader) loader.classList.add('active');
    }

    function hideLoader() {
      const loader = document.getElementById('mizuikuLoader');
      if (loader) loader.classList.remove('active');
    }

    // ============================================================
    // AUTOMATIC FAVICON EXTRACTOR
    // ============================================================
    function extractFavicon(url) {
      if (!url) return 'https://i.postimg.cc/d01s2X3T/MIzuiku.png';
      try {
        let trimmed = url.trim();
        if (!/^https?:\/\//i.test(trimmed)) {
          trimmed = 'https://' + trimmed;
        }
        const parsed = new URL(trimmed);
        return `https://www.google.com/s2/favicons?domain=${encodeURIComponent(parsed.origin)}&sz=128`;
      } catch (e) {
        return 'https://i.postimg.cc/d01s2X3T/MIzuiku.png';
      }
    }

    function previewAutoFavicon(val) {
      const previewImg = document.getElementById('faviconPreviewImg');
      if (!previewImg) return;
      previewImg.src = extractFavicon(val);
    }

    // ============================================================
    // DATA ACCESS: LOCAL STORAGE & GOOGLE SHEETS
    // ============================================================
    function getStoredApps() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) return parsed;
        }
      } catch (e) {
        console.error('Failed to parse local apps:', e);
      }
      return [];
    }

    function getAdminPin() {
      return localStorage.getItem(ADMIN_PIN_KEY) || DEFAULT_PIN;
    }

    async function fetchAppsFromCloud(forceRender = false) {
      if (isFetchingCloud || isSavingCloud) return;
      isFetchingCloud = true;

      try {
        const res = await fetch(`${DEFAULT_GAS_URL}?app=mizuiku&t=${Date.now()}`);
        if (res.ok) {
          const data = await res.json();
          if (isSavingCloud) return;

          if (data && data.status === 'success' && Array.isArray(data.data)) {
            const cloudApps = data.data;
            const localJson = localStorage.getItem(STORAGE_KEY);
            const cloudJson = JSON.stringify(cloudApps);

            if (localJson !== cloudJson) {
              localStorage.setItem(STORAGE_KEY, cloudJson);
              renderApps();
            } else if (forceRender) {
              renderApps();
            }
          }
        }
      } catch (err) {
        console.warn('Background sync offline fallback:', err);
      } finally {
        isFetchingCloud = false;
      }
    }

    async function saveAppsToCloud(apps) {
      isSavingCloud = true;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(apps));
      renderApps();

      try {
        const res = await fetch(DEFAULT_GAS_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'saveApps',
            app: 'mizuiku',
            apps: apps
          })
        });

        if (res.ok) {
          const data = await res.json();
          if (data && data.status === 'success' && Array.isArray(data.data)) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data.data));
            renderApps();
          }
        }
      } catch (err) {
        console.warn('Cloud save fallback to local storage:', err);
      } finally {
        isSavingCloud = false;
      }
    }

    // ============================================================
    // REORDER APPS (Admin Mode Drag & Drop)
    // ============================================================
    async function reorderApps(sourceId, targetId) {
      let apps = getStoredApps();
      const sourceIndex = apps.findIndex(a => a.id === sourceId);
      const targetIndex = apps.findIndex(a => a.id === targetId);

      if (sourceIndex === -1 || targetIndex === -1 || sourceIndex === targetIndex) return;

      const [movedApp] = apps.splice(sourceIndex, 1);
      apps.splice(targetIndex, 0, movedApp);

      // Re-assign order indices
      apps.forEach((a, idx) => { a.order = idx + 1; });

      showLoader();
      await saveAppsToCloud(apps);
      hideLoader();
      showToast('จัดเรียงลำดับแอปเรียบร้อยแล้ว');
    }

    // ============================================================
    // RENDER APPS (Compact Icon + Name Launcher Layout)
    // ============================================================
    function renderApps() {
      const container = document.getElementById('appsContainer');
      const allApps = getStoredApps();
      const isAdmin = currentRole === 'admin';

      // Update Admin Top Bar visibility
      const adminTopBar = document.getElementById('adminTopBar');
      if (adminTopBar) {
        adminTopBar.style.display = isAdmin ? 'flex' : 'none';
      }

      // 1. Empty State
      if (allApps.length === 0) {
        container.innerHTML = `
          <div class="empty-state-card">
            <div class="empty-icon-wrap">
              <img src="https://i.postimg.cc/d01s2X3T/MIzuiku.png" alt="Mizuiku" class="empty-icon-img">
            </div>
            <div class="empty-title">ยินดีต้อนรับสู่ Mizuiku</div>
            <div class="empty-desc">
              ${isAdmin 
                ? 'ยังไม่มีเว็บแอปในระบบ เริ่มต้นสร้างระบบนิเวศการทำงานของคุณได้ทันที' 
                : 'ยังไม่มีเว็บแอปในระบบ กรุณาเข้าสู่โหมดแอดมินเพื่อเพิ่มเว็บแอป'}
            </div>
            ${isAdmin ? `
              <button class="btn-water-primary" onclick="openAddAppModal()" style="padding: 10px 24px;">
                <i class="bi bi-plus-circle-fill"></i>
                <span>เพิ่มเว็บแอปแรกของคุณ</span>
              </button>
            ` : `
              <button class="role-btn" onclick="toggleRole()" style="padding: 8px 20px; margin: 0 auto;">
                <i class="bi bi-shield-lock"></i>
                <span>เข้าสู่ระบบแอดมิน</span>
              </button>
            `}
          </div>
        `;
        return;
      }

      // 2. Compact Grid of App Icons + Titles
      let html = '<div class="apps-grid" id="appsGrid">';

      allApps.forEach(app => {
        const isMaintenance = app.active === false;
        const iconSrc = app.icon || extractFavicon(app.url);

        html += `
          <div class="app-card ${isMaintenance ? 'maintenance-card' : ''}" 
               id="card-${app.id}" 
               data-id="${app.id}"
               onclick="handleCardClick('${app.id}', event)">
            
            ${isAdmin ? `
              <span class="drag-grip-indicator" title="ลากเพื่อเรียงลำดับ">
                <i class="bi bi-grip-vertical"></i>
              </span>
              <div class="admin-card-actions">
                <button class="admin-icon-btn" onclick="openEditAppModal('${app.id}', event)" title="แก้ไข">
                  <i class="bi bi-pencil-fill"></i>
                </button>
                <button class="admin-icon-btn del" onclick="confirmDeleteApp('${app.id}', event)" title="ลบ">
                  <i class="bi bi-trash3-fill"></i>
                </button>
              </div>
            ` : ''}

            <div class="app-icon-frame">
              <img src="${iconSrc}" alt="${escapeHtml(app.name)}" onerror="handleIconError(this, '${escapeHtml(app.name)}')">
            </div>
            
            <div class="app-name" title="${escapeHtml(app.name)}">${escapeHtml(app.name)}</div>
          </div>
        `;
      });

      html += '</div>';
      container.innerHTML = html;

      // Attach Drag & Drop handlers if Admin
      if (isAdmin) {
        initDragAndDrop();
      }
    }

    function handleCardClick(appId, event) {
      if (event.target.closest('.admin-card-actions') || event.target.closest('.drag-grip-indicator')) {
        return;
      }
      openInAppViewer(appId);
    }

    function handleIconError(img, name) {
      img.outerHTML = `<span class="fallback-icon">${name ? name.charAt(0).toUpperCase() : '💧'}</span>`;
    }

    function escapeHtml(text) {
      if (!text) return '';
      return String(text).replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    // ============================================================
    // DRAG AND DROP HANDLERS (Desktop & Mobile Touch)
    // ============================================================
    function initDragAndDrop() {
      const cards = document.querySelectorAll('.app-card');
      cards.forEach(card => {
        card.setAttribute('draggable', 'true');

        // Desktop Drag events
        card.addEventListener('dragstart', (e) => {
          draggedAppId = card.dataset.id;
          card.classList.add('is-dragging');
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', card.dataset.id);
        });

        card.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          if (draggedAppId && draggedAppId !== card.dataset.id) {
            card.classList.add('drag-over');
          }
        });

        card.addEventListener('dragleave', () => {
          card.classList.remove('drag-over');
        });

        card.addEventListener('drop', (e) => {
          e.preventDefault();
          card.classList.remove('drag-over');
          const sourceId = e.dataTransfer.getData('text/plain') || draggedAppId;
          if (sourceId && sourceId !== card.dataset.id) {
            reorderApps(sourceId, card.dataset.id);
          }
        });

        card.addEventListener('dragend', () => {
          card.classList.remove('is-dragging');
          document.querySelectorAll('.app-card').forEach(c => c.classList.remove('drag-over'));
          draggedAppId = null;
        });

        // Mobile Touch Reorder events
        card.addEventListener('touchstart', (e) => {
          if (e.target.closest('.admin-card-actions')) return;
          const touch = e.touches[0];
          touchStartX = touch.clientX;
          touchStartY = touch.clientY;
          touchActiveCard = card;
          touchActiveId = card.dataset.id;
          isDraggingTouch = false;
        }, { passive: true });

        card.addEventListener('touchmove', (e) => {
          if (!touchActiveCard) return;
          const touch = e.touches[0];
          const diffX = Math.abs(touch.clientX - touchStartX);
          const diffY = Math.abs(touch.clientY - touchStartY);

          if (diffX > 12 || diffY > 12) {
            isDraggingTouch = true;
            touchActiveCard.classList.add('is-dragging');

            const elem = document.elementFromPoint(touch.clientX, touch.clientY);
            const targetCard = elem ? elem.closest('.app-card') : null;

            document.querySelectorAll('.app-card').forEach(c => {
              if (c !== touchActiveCard) c.classList.remove('drag-over');
            });

            if (targetCard && targetCard !== touchActiveCard) {
              targetCard.classList.add('drag-over');
            }
          }
        }, { passive: true });

        card.addEventListener('touchend', (e) => {
          if (touchActiveCard && isDraggingTouch) {
            const touch = e.changedTouches[0];
            const elem = document.elementFromPoint(touch.clientX, touch.clientY);
            const targetCard = elem ? elem.closest('.app-card') : null;

            if (targetCard && targetCard.dataset.id && targetCard.dataset.id !== touchActiveId) {
              reorderApps(touchActiveId, targetCard.dataset.id);
            }
          }

          document.querySelectorAll('.app-card').forEach(c => {
            c.classList.remove('is-dragging', 'drag-over');
          });
          touchActiveCard = null;
          touchActiveId = null;
          isDraggingTouch = false;
        });
      });
    }

    // ============================================================
    // IN-APP FULLSCREEN VIEWER
    // ============================================================
    function openInAppViewer(appId) {
      const apps = getStoredApps();
      const app = apps.find(a => a.id === appId);
      if (!app) return;

      currentViewerApp = app;

      const overlay = document.getElementById('viewerOverlay');
      const iframe = document.getElementById('viewerIframe');
      const title = document.getElementById('viewerAppTitle');
      const icon = document.getElementById('viewerAppIcon');
      const loader = document.getElementById('viewerLoader');

      title.textContent = app.name;
      icon.src = app.icon || extractFavicon(app.url);

      loader.style.display = 'flex';
      loader.style.opacity = '1';

      overlay.classList.add('active');
      iframe.src = app.url;

      document.body.style.overflow = 'hidden';
    }

    function onIframeLoaded() {
      const loader = document.getElementById('viewerLoader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => { loader.style.display = 'none'; }, 250);
      }
    }

    function closeViewer() {
      const overlay = document.getElementById('viewerOverlay');
      const iframe = document.getElementById('viewerIframe');
      overlay.classList.remove('active');
      iframe.src = 'about:blank';
      document.body.style.overflow = '';
      currentViewerApp = null;
    }

    function reloadViewer() {
      const iframe = document.getElementById('viewerIframe');
      const loader = document.getElementById('viewerLoader');
      if (currentViewerApp && iframe) {
        loader.style.display = 'flex';
        loader.style.opacity = '1';
        iframe.src = currentViewerApp.url;
      }
    }

    function toggleViewerFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
      }
    }

    function openViewerExternal() {
      if (currentViewerApp && currentViewerApp.url) {
        window.open(currentViewerApp.url, '_blank');
      }
    }

    // ============================================================
    // APP MODAL (ADD / EDIT - Only Name & URL, Auto Favicon)
    // ============================================================
    function openAddAppModal() {
      if (currentRole !== 'admin') {
        openPinModal(() => {
          openAddAppModal();
        });
        return;
      }

      document.getElementById('appModalTitle').innerHTML = '<i class="bi bi-plus-circle" style="color: var(--water-primary);"></i> เพิ่มเว็บแอปใหม่';
      document.getElementById('formAppId').value = '';
      document.getElementById('formAppName').value = '';
      document.getElementById('formAppUrl').value = '';
      document.getElementById('formAppActive').checked = true;
      document.getElementById('faviconPreviewImg').src = 'https://i.postimg.cc/d01s2X3T/MIzuiku.png';

      document.getElementById('appModal').classList.add('active');
    }

    function openEditAppModal(appId, event) {
      if (event) event.stopPropagation();
      const apps = getStoredApps();
      const app = apps.find(a => a.id === appId);
      if (!app) return;

      document.getElementById('appModalTitle').innerHTML = '<i class="bi bi-pencil-square" style="color: var(--water-primary);"></i> แก้ไขเว็บแอป';
      document.getElementById('formAppId').value = app.id;
      document.getElementById('formAppName').value = app.name || '';
      document.getElementById('formAppUrl').value = app.url || '';
      document.getElementById('formAppActive').checked = app.active !== false;
      document.getElementById('faviconPreviewImg').src = app.icon || extractFavicon(app.url);

      document.getElementById('appModal').classList.add('active');
    }

    function closeAppModal() {
      document.getElementById('appModal').classList.remove('active');
    }

    async function handleAppFormSubmit(e) {
      e.preventDefault();
      const appId = document.getElementById('formAppId').value;
      const name = document.getElementById('formAppName').value.trim();
      const url = document.getElementById('formAppUrl').value.trim();
      const active = document.getElementById('formAppActive').checked;

      if (!name || !url) {
        showToast('กรุณากรอกชื่อและ URL ให้ครบถ้วน');
        return;
      }

      // Automatically generate favicon from URL
      const icon = extractFavicon(url);

      closeAppModal();
      showLoader();

      let apps = getStoredApps();

      if (appId) {
        const index = apps.findIndex(a => a.id === appId);
        if (index !== -1) {
          apps[index] = { ...apps[index], name, url, icon, active };
        }
      } else {
        const newApp = {
          id: 'app-' + Date.now(),
          name,
          url,
          icon,
          active,
          order: apps.length + 1
        };
        apps.push(newApp);
      }

      await saveAppsToCloud(apps);
      hideLoader();
      showToast(appId ? 'บันทึกการแก้ไขเรียบร้อยแล้ว' : 'เพิ่มเว็บแอปสำเร็จแล้ว');
    }

    async function confirmDeleteApp(appId, event) {
      if (event) event.stopPropagation();
      const apps = getStoredApps();
      const app = apps.find(a => a.id === appId);
      if (!app) return;

      if (confirm(`คุณต้องการลบเว็บแอป "${app.name}" หรือไม่?`)) {
        showLoader();
        const updated = apps.filter(a => a.id !== appId);
        await saveAppsToCloud(updated);
        hideLoader();
        showToast('ลบเว็บแอปเรียบร้อยแล้ว');
      }
    }

    // ============================================================
    // ADMIN ROLE & PIN AUTHENTICATION
    // ============================================================
    let pinCallback = null;

    function toggleRole() {
      if (currentRole === 'admin') {
        currentRole = 'guest';
        updateRoleUI();
        renderApps();
        showToast('ออกจากโหมดแอดมินแล้ว');
      } else {
        openPinModal(() => {
          currentRole = 'admin';
          updateRoleUI();
          renderApps();
          showToast('เข้าสู่โหมดแอดมินสำเร็จ');
        });
      }
    }

    function updateRoleUI() {
      const roleBtn = document.getElementById('roleBtn');
      const roleText = document.getElementById('roleText');
      const roleIcon = document.getElementById('roleIcon');

      if (currentRole === 'admin') {
        roleBtn.classList.add('admin-active');
        roleText.textContent = 'โหมดแอดมิน';
        roleIcon.className = 'bi bi-shield-check';
      } else {
        roleBtn.classList.remove('admin-active');
        roleText.textContent = 'แอดมิน';
        roleIcon.className = 'bi bi-shield-lock';
      }
    }

    function openPinModal(onSuccess) {
      pinCallback = onSuccess;
      enteredPin = '';
      updatePinDots();
      document.getElementById('pinModal').classList.add('active');
    }

    function closePinModal() {
      document.getElementById('pinModal').classList.remove('active');
      enteredPin = '';
      pinCallback = null;
    }

    function pressPin(digit) {
      if (enteredPin.length < 4) {
        enteredPin += digit;
        updatePinDots();
        if (enteredPin.length === 4) {
          setTimeout(verifyPin, 150);
        }
      }
    }

    function clearPin() {
      enteredPin = '';
      updatePinDots();
    }

    function backspacePin() {
      if (enteredPin.length > 0) {
        enteredPin = enteredPin.slice(0, -1);
        updatePinDots();
      }
    }

    function updatePinDots() {
      for (let i = 0; i < 4; i++) {
        const dot = document.getElementById(`pinDot${i}`);
        if (dot) {
          if (i < enteredPin.length) {
            dot.classList.add('filled');
          } else {
            dot.classList.remove('filled');
          }
        }
      }
    }

    function verifyPin() {
      const targetPin = getAdminPin();
      if (enteredPin === targetPin) {
        const cb = pinCallback;
        closePinModal();
        if (cb) cb();
      } else {
        showToast('รหัส PIN ไม่ถูกต้อง (รหัสเริ่มต้นคือ 8055)');
        clearPin();
      }
    }

    // ============================================================
    // PWA & TOAST HELPERS
    // ============================================================
    function initPwaEvents() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.warn('SW registration skipped:', err);
        });
      }

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        const btn = document.getElementById('installPwaBtn');
        if (btn) btn.style.display = 'flex';
      });
    }

    function handlePwaInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          deferredPrompt = null;
          const btn = document.getElementById('installPwaBtn');
          if (btn) btn.style.display = 'none';
        });
      } else {
        showToast('แตะปุ่มแชร์ (Share) แล้วเลือก "เพิ่มไปยังหน้าจอโฮม" เพื่อติดตั้ง');
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      if (toast && toastMsg) {
        toastMsg.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => {
          toast.classList.remove('show');
        }, 2500);
      }
    }
  </script>
</body>
