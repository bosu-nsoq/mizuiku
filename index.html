<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mizuiku</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://i.postimg.cc/d01s2X3T/MIzuiku.png">
  <link rel="shortcut icon" type="image/png" href="https://i.postimg.cc/d01s2X3T/MIzuiku.png">
  
  <!-- PWA & Apple Mobile Web App Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#E0F2FE">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mizuiku">
  <link rel="apple-touch-icon" href="https://i.postimg.cc/d01s2X3T/MIzuiku.png">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Google Font: Mali -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mali:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root {
      /* Bright Blue & White Theme */
      --bg-sky-top: #F0F9FF;
      --bg-sky-mid: #E0F2FE;
      --bg-sky-bottom: #BAE6FD;
      
      --bg-card: rgba(255, 255, 255, 0.94);
      --bg-card-hover: #FFFFFF;
      --bg-card-glass: rgba(255, 255, 255, 0.85);
      
      --text-main: #0F172A; /* High-contrast slate navy */
      --text-sub: #0369A1; /* Ocean deep blue */
      --text-muted: #64748B; /* Soft slate */
      
      --water-primary: #0284C7; /* Azure Blue */
      --water-vivid: #0EA5E9; /* Sky Water */
      --water-cyan: #38BDF8; /* Crystal Cyan */
      --water-light: #E0F2FE; /* Soft Water tint */
      --nature-mint: #10B981;
      --sun-gold: #F59E0B;
      --danger: #EF4444;
      
      --border-water: rgba(56, 189, 248, 0.35);
      --border-hover: #0EA5E9;
      --glow-water: rgba(14, 165, 233, 0.22);
      
      --shadow-water: 0 10px 25px -5px rgba(14, 165, 233, 0.10), 0 8px 10px -6px rgba(14, 165, 233, 0.05);
      --shadow-hover: 0 20px 35px -8px rgba(14, 165, 233, 0.22), 0 0 20px 2px rgba(56, 189, 248, 0.22);
      
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Mali', cursive, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(180deg, #F0F9FF 0%, #E0F2FE 45%, #BAE6FD 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }

    /* Ambient Water & Nature Background Light Glows */
    .nature-bg-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .water-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
      animation: floatOrb 18s ease-in-out infinite alternate;
    }

    .water-orb-1 {
      width: 480px;
      height: 480px;
      top: -120px;
      right: -80px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.35), rgba(186, 230, 253, 0.15));
    }

    .water-orb-2 {
      width: 550px;
      height: 550px;
      bottom: -150px;
      left: -120px;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.25), rgba(224, 242, 254, 0.2));
      animation-duration: 22s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, 25px) scale(1.08); }
      100% { transform: translate(-25px, 40px) scale(0.95); }
    }

    /* Bottom Animated Flowing Water Waves */
    .nature-waves {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 140px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.65;
    }

    /* ============================================================
       LOADING SCREEN OVERLAY (หน้าโหลดระหว่างทำงาน / Google Sheets)
       ============================================================ */
    .nature-loader-overlay {
      position: fixed;
      inset: 0;
      z-index: 3000;
      background: rgba(240, 249, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .nature-loader-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .nature-loader-box {
      background: #FFFFFF;
      border: 1.5px solid var(--water-cyan);
      box-shadow: 0 16px 40px -8px rgba(14, 165, 233, 0.25), 0 0 30px rgba(56, 189, 248, 0.3);
      border-radius: 28px;
      padding: 36px 40px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      max-width: 90vw;
      width: 320px;
      transform: scale(0.95);
      transition: transform 0.3s ease;
    }

    .nature-loader-overlay.active .nature-loader-box {
      transform: scale(1);
    }

    .loader-icon-container {
      position: relative;
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .water-ripple-ring {
      position: absolute;
      inset: -8px;
      border: 2.5px solid var(--water-vivid);
      border-radius: 50%;
      animation: ripplePulse 2s ease-out infinite;
      opacity: 0;
    }

    .water-ripple-ring.ring-2 {
      animation-delay: 1s;
    }

    @keyframes ripplePulse {
      0% { transform: scale(0.7); opacity: 0.9; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    .loader-logo-img {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      object-fit: cover;
      box-shadow: 0 6px 16px rgba(14, 165, 233, 0.35);
      z-index: 2;
      animation: gentleFloat 2.5s ease-in-out infinite alternate;
    }

    @keyframes gentleFloat {
      0% { transform: translateY(0); }
      100% { transform: translateY(-5px); }
    }

    .loader-text {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .loader-subtext {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    /* ============================================================
       HEADER (Single-Line on Mobile, Blue-White Theme)
       ============================================================ */
    header.mizuiku-header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: rgba(255, 255, 255, 0.88);
      border-bottom: 1.5px solid rgba(56, 189, 248, 0.28);
      padding: 10px 16px;
      box-shadow: 0 4px 18px rgba(14, 165, 233, 0.08);
      transition: all 0.25s ease;
    }

    .header-container {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    /* Brand Section: strictly single-line white-space: nowrap on mobile */
    .brand-section {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      flex-shrink: 0;
      user-select: none;
      cursor: pointer;
    }

    .brand-logo-wrap {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: #FFFFFF;
      border: 1.5px solid var(--water-cyan);
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      transition: transform 0.3s ease;
    }

    .brand-logo-wrap:hover {
      transform: scale(1.08) rotate(4deg);
    }

    .brand-logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .brand-text-block {
      display: flex;
      flex-direction: column;
      justify-content: center;
      white-space: nowrap;
    }

    .brand-title {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #0284C7 0%, #0EA5E9 60%, #0369A1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
    }

    /* Header Tools */
    .header-tools {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: nowrap;
    }

    /* Thai Buddhist Era Date Badge */
    .date-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #FFFFFF;
      border: 1px solid var(--border-water);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-sub);
      box-shadow: 0 2px 8px rgba(14, 165, 233, 0.08);
      white-space: nowrap;
    }

    .date-badge i {
      color: var(--water-vivid);
      font-size: 0.85rem;
    }

    /* Admin Role Pill Button */
    .role-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid var(--border-water);
      background: #FFFFFF;
      color: var(--text-sub);
      box-shadow: 0 2px 8px rgba(14, 165, 233, 0.08);
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .role-btn:hover {
      border-color: var(--water-vivid);
      color: var(--water-primary);
      box-shadow: 0 0 12px var(--glow-water);
    }

    .role-btn.admin-active {
      background: linear-gradient(135deg, #0284C7 0%, #0EA5E9 100%);
      border-color: #38BDF8;
      color: #FFFFFF;
      box-shadow: 0 4px 14px rgba(14, 165, 233, 0.35);
    }

    .btn-icon-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border-water);
      background: #FFFFFF;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.95rem;
      box-shadow: 0 2px 8px rgba(14, 165, 233, 0.08);
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .btn-icon-circle:hover {
      background: var(--water-light);
      border-color: var(--water-vivid);
      color: var(--water-primary);
      box-shadow: 0 0 12px var(--glow-water);
    }

    /* ============================================================
       MAIN CONTENT CONTAINER
       ============================================================ */
    main.mizuiku-main {
      flex: 1;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 16px 80px 16px;
      position: relative;
      z-index: 1;
    }

    /* Action Bar: Search & Add App (Clean, No Cloud button) */
    .action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .search-box-wrap {
      position: relative;
      flex: 1;
      min-width: 240px;
      max-width: 480px;
    }

    .search-box-wrap i.search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--water-vivid);
      font-size: 0.95rem;
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      background: #FFFFFF;
      border: 1.5px solid rgba(56, 189, 248, 0.4);
      border-radius: 14px;
      padding: 10px 38px 10px 38px;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      box-shadow: 0 2px 10px rgba(14, 165, 233, 0.06);
      transition: all 0.25s ease;
    }

    .search-input:focus {
      border-color: var(--water-vivid);
      box-shadow: 0 0 14px var(--glow-water);
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-clear-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: none;
      font-size: 0.9rem;
    }

    .search-clear-btn:hover {
      color: var(--text-main);
    }

    .top-action-buttons {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-water-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #0284C7 0%, #0EA5E9 100%);
      border: 1px solid #38BDF8;
      color: #FFFFFF;
      padding: 10px 20px;
      border-radius: 14px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(14, 165, 233, 0.35);
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-water-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(14, 165, 233, 0.45);
      background: linear-gradient(135deg, #0369A1 0%, #0284C7 100%);
    }

    /* ============================================================
       EMPTY STATE (Clean Water Welcome Card)
       ============================================================ */
    .empty-state-card {
      background: rgba(255, 255, 255, 0.92);
      border: 2px dashed rgba(56, 189, 248, 0.5);
      border-radius: 26px;
      padding: 50px 24px;
      text-align: center;
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow-water);
      max-width: 620px;
      margin: 30px auto;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .empty-state-card:hover {
      border-color: var(--water-vivid);
      box-shadow: var(--shadow-hover);
    }

    .empty-icon-wrap {
      width: 88px;
      height: 88px;
      margin: 0 auto 20px auto;
      border-radius: 24px;
      background: #FFFFFF;
      border: 2px solid var(--water-cyan);
      box-shadow: 0 8px 24px rgba(14, 165, 233, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      animation: gentlePulse 3s infinite ease-in-out;
    }

    @keyframes gentlePulse {
      0%, 100% { transform: scale(1); box-shadow: 0 6px 20px rgba(14, 165, 233, 0.2); }
      50% { transform: scale(1.05); box-shadow: 0 10px 28px rgba(14, 165, 233, 0.35); }
    }

    .empty-icon-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .empty-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #0F172A;
      margin-bottom: 8px;
    }

    .empty-desc {
      font-size: 0.92rem;
      color: var(--text-sub);
      line-height: 1.6;
      max-width: 440px;
      margin: 0 auto 24px auto;
    }

    /* ============================================================
       APPS GRID & APP CARDS (Bright White & Water Blue)
       ============================================================ */
    .apps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 10px;
    }

    .app-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-water);
      border-radius: 22px;
      padding: 20px;
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow-water);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .app-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3.5px;
      background: linear-gradient(90deg, #38BDF8, #0284C7, #0D9488);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .app-card:hover {
      transform: translateY(-5px);
      border-color: var(--border-hover);
      box-shadow: var(--shadow-hover);
      background: var(--bg-card-hover);
    }

    .app-card:hover::before {
      opacity: 1;
    }

    .app-card.maintenance-card {
      opacity: 0.75;
      border-color: rgba(245, 158, 11, 0.4);
    }

    .app-card.maintenance-card::before {
      background: linear-gradient(90deg, #F59E0B, #EF4444);
      opacity: 1;
    }

    /* Card Top Area */
    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 14px;
    }

    .app-icon-frame {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      background: #FFFFFF;
      border: 1.5px solid var(--water-cyan);
      box-shadow: 0 4px 14px rgba(14, 165, 233, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .app-icon-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .app-icon-frame .fallback-icon {
      font-size: 1.6rem;
      color: var(--water-primary);
    }

    .app-info {
      flex: 1;
      min-width: 0;
    }

    .app-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .app-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: #0F172A;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .app-category-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      background: #E0F2FE;
      color: #0369A1;
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 8px;
      padding: 2px 8px;
      margin-bottom: 6px;
    }

    .app-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--nature-mint);
      box-shadow: 0 0 6px var(--nature-mint);
    }

    .status-dot.maintenance {
      background: var(--sun-gold);
      box-shadow: 0 0 6px var(--sun-gold);
    }

    /* Card Actions Footer */
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(56, 189, 248, 0.2);
    }

    .btn-open-app {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #0284C7 0%, #0EA5E9 100%);
      border: 1px solid #38BDF8;
      color: #FFFFFF;
      padding: 9px 14px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      box-shadow: 0 3px 10px rgba(14, 165, 233, 0.25);
    }

    .btn-open-app:hover {
      background: linear-gradient(135deg, #0369A1 0%, #0284C7 100%);
      box-shadow: 0 5px 16px rgba(14, 165, 233, 0.4);
      transform: translateY(-1px);
    }

    .btn-card-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border-water);
      background: #FFFFFF;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .btn-card-icon:hover {
      background: #E0F2FE;
      border-color: var(--water-vivid);
      color: var(--water-primary);
    }

    /* Admin Quick Controls on Card */
    .admin-card-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed rgba(56, 189, 248, 0.3);
    }

    .admin-pill-btn {
      font-size: 0.74rem;
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid var(--border-water);
      background: #FFFFFF;
      color: var(--text-sub);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .admin-pill-btn:hover {
      border-color: var(--water-vivid);
      background: #F0F9FF;
      color: var(--water-primary);
    }

    .admin-pill-btn.delete:hover {
      border-color: var(--danger);
      color: var(--danger);
      background: #FEE2E2;
    }

    /* ============================================================
       IN-APP FULLSCREEN WEB APP VIEWER
       ============================================================ */
    .viewer-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: #0F172A;
      display: none;
      flex-direction: column;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .viewer-overlay.active {
      display: flex;
      opacity: 1;
    }

    /* Floating Island Toolbar in Viewer */
    .viewer-toolbar {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1010;

      align-items: center;

      margin-top: 8px;
    }

    .preset-icon-chip {

  <script>
    // ============================================================
    // STATE & CONFIGURATION (Google Sheets Automatic Sync)
    // ============================================================
    const STORAGE_KEY = 'mizuiku_apps_data_v2';
    const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbznuwVPbNJ-QZyKqpJayU2XAIpFrT-FhYzXqaSFyzDdYziPmZiNI-936rHR4oV6FVpT/exec';
    const ADMIN_PIN_KEY = 'mizuiku_admin_pin';
    const DEFAULT_PIN = '8055';

    let currentRole = 'guest'; // 'guest' | 'admin'
    let enteredPin = '';
    let searchQuery = '';
    let deferredPrompt = null;
    let currentViewerApp = null;
    let isFetchingCloud = false;
    let isSavingCloud = false;

    // ============================================================
    // INITIALIZATION
    // ============================================================
    document.addEventListener('DOMContentLoaded', async () => {
      initThaiDate();
      renderApps();
      initPwaEvents();

      // Show splash loader on start and fetch latest from Google Sheets
      showLoader('กำลังเชื่อมต่อข้อมูล Google Sheets...');
      try {
        await Promise.race([
          fetchAppsFromCloud(true),
          new Promise(resolve => setTimeout(resolve, 2000)) // Fallback timeout if slow
        ]);
      } catch (err) {
        console.warn('Initial cloud sync error:', err);
      } finally {
        hideLoader();
      }
    });

    // Background Auto-Sync: Poll every 4 seconds for instant multi-device updates
    setInterval(() => {
      fetchAppsFromCloud(false);
    }, 4000);

    // Multi-Device Auto-Sync on Tab Focus & Visibility Change
    window.addEventListener('focus', () => fetchAppsFromCloud(false));
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        fetchAppsFromCloud(false);
      }
    });

    // ============================================================
    // FULL SCREEN LOADER HELPERS (หน้าโหลดระหว่างทำงาน)
    // ============================================================
    function showLoader(message = 'กำลังโหลดข้อมูลระบบ...') {
      const loader = document.getElementById('mizuikuLoader');
      const textEl = document.getElementById('loaderStatusText');
      if (textEl) textEl.textContent = message;
      if (loader) loader.classList.add('active');
    }

    function hideLoader() {
      const loader = document.getElementById('mizuikuLoader');
      if (loader) loader.classList.remove('active');
    }

    // ============================================================
    // THAI BUDDHIST ERA DATE (dd/mm/yyyy พ.ศ.)
    // ============================================================
    function initThaiDate() {
      const dateEl = document.getElementById('dateDisplay');
      if (!dateEl) return;

      const now = new Date();
      const day = String(now.getDate()).padStart(2, '0');
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const yearBE = now.getFullYear() + 543;

      dateEl.textContent = `${day}/${month}/${yearBE}`;
    }

    // ============================================================
    // DATA ACCESS: LOCAL STORAGE & GOOGLE SHEETS CLOUD
    // ============================================================
    function getStoredApps() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) return parsed;
        }
      } catch (e) {
        console.error('Failed to parse local apps:', e);
      }
      return [];
    }

    function getAdminPin() {
      return localStorage.getItem(ADMIN_PIN_KEY) || DEFAULT_PIN;
    }

    // Read from Google Sheets in background
    async function fetchAppsFromCloud(forceRender = false) {
      if (isFetchingCloud || isSavingCloud) return;
      isFetchingCloud = true;

      try {
        const res = await fetch(`${DEFAULT_GAS_URL}?app=mizuiku&t=${Date.now()}`);
        if (res.ok) {
          const data = await res.json();
          if (isSavingCloud) return;

          if (data && data.status === 'success' && Array.isArray(data.data)) {
            const cloudApps = data.data;
            const localJson = localStorage.getItem(STORAGE_KEY);
            const cloudJson = JSON.stringify(cloudApps);

            if (localJson !== cloudJson) {
              localStorage.setItem(STORAGE_KEY, cloudJson);
              renderApps();
            } else if (forceRender) {
              renderApps();
            }
          }
        }
      } catch (err) {
        console.warn('Background sync offline fallback:', err);
      } finally {
        isFetchingCloud = false;
      }
    }

    // Save to Google Sheets
    async function saveAppsToCloud(apps) {
      isSavingCloud = true;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(apps));
      renderApps();

      try {
        const res = await fetch(DEFAULT_GAS_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'saveApps',
            app: 'mizuiku',
            apps: apps
          })
        });

        if (res.ok) {
          const data = await res.json();
          if (data && data.status === 'success' && Array.isArray(data.data)) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data.data));
            renderApps();
          }
        }
      } catch (err) {
        console.warn('Cloud save fallback to local storage:', err);
      } finally {
        isSavingCloud = false;
      }
    }

    // ============================================================
    // RENDER APPS GRID OR NATURE EMPTY STATE
    // ============================================================
    function renderApps() {
      const container = document.getElementById('appsContainer');
      const allApps = getStoredApps();

      // Filter by search query
      const filteredApps = allApps.filter(app => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        return (app.name && app.name.toLowerCase().includes(q)) ||
               (app.category && app.category.toLowerCase().includes(q)) ||
               (app.url && app.url.toLowerCase().includes(q));
      });

      // 1. If no apps at all in storage (Empty State)
      if (allApps.length === 0) {
        container.innerHTML = `
          <div class="empty-state-card">
            <div class="empty-icon-wrap">
              <img src="https://i.postimg.cc/d01s2X3T/MIzuiku.png" alt="Mizuiku" class="empty-icon-img">
            </div>
            <div class="empty-title">ยินดีต้อนรับสู่ Mizuiku</div>
            <div class="empty-desc">
              สายน้ำแห่งการเรียนรู้และการรวมศูนย์เว็บแอปของคุณ<br>
              ยังไม่มีเว็บแอปในระบบ เริ่มต้นสร้างระบบนิเวศการทำงานของคุณได้ทันที
            </div>
            <button class="btn-water-primary" onclick="openAddAppModal()" style="padding: 12px 28px; font-size: 0.95rem;">
              <i class="bi bi-plus-circle-fill"></i>
              <span>เพิ่มเว็บแอปแรกของคุณ</span>
            </button>
          </div>
        `;
        return;
      }

      // 2. If filtered search yields 0 results
      if (filteredApps.length === 0) {
        container.innerHTML = `
          <div class="empty-state-card" style="padding: 36px 20px;">
            <i class="bi bi-search" style="font-size: 2.5rem; color: var(--water-primary); opacity: 0.6; margin-bottom: 12px; display: block;"></i>
            <div class="empty-title" style="font-size: 1.15rem;">ไม่พบเว็บแอปที่ค้นหา</div>
            <div class="empty-desc" style="font-size: 0.88rem; margin-bottom: 16px;">ลองค้นหาด้วยคำอื่น หรือกดล้างการค้นหา</div>
            <button class="btn-card-icon" style="width: auto; padding: 8px 18px; margin: 0 auto; border-radius: 12px; font-weight: 600;" onclick="clearSearch()">ล้างการค้นหา</button>
          </div>
        `;
        return;
      }

      // 3. Render Apps Grid
      let html = '<div class="apps-grid">';

      filteredApps.forEach(app => {
        const isMaintenance = app.active === false;
        const iconSrc = getAppIconSrc(app);

        html += `
          <div class="app-card ${isMaintenance ? 'maintenance-card' : ''}" id="card-${app.id}">
            <div>
              <div class="card-top">
                <div class="app-icon-frame">
                  ${iconSrc.isImg ? `<img src="${iconSrc.src}" alt="${escapeHtml(app.name)}" onerror="handleIconError(this, '${escapeHtml(app.name)}')">` : `<span class="fallback-icon">${iconSrc.src}</span>`}
                </div>
                <div class="app-info">
                  <div class="app-title-row">
                    <div class="app-name" title="${escapeHtml(app.name)}">${escapeHtml(app.name)}</div>
                  </div>
                  <span class="app-category-badge">${escapeHtml(app.category || 'ทั่วไป')}</span>
                  <div class="app-status-badge">
                    <span class="status-dot ${isMaintenance ? 'maintenance' : ''}"></span>
                    <span>${isMaintenance ? 'ปิดปรับปรุง' : 'พร้อมใช้งาน'}</span>
                  </div>
                </div>
              </div>
            </div>

            <div>
              <div class="card-footer">
                <button class="btn-open-app" onclick="openInAppViewer('${app.id}')" ${isMaintenance && currentRole !== 'admin' ? 'disabled style="opacity:0.5; cursor:not-allowed;"' : ''}>
                  <i class="bi bi-play-circle-fill"></i>
                  <span>เปิดใช้งานแอป</span>
                </button>
                <button class="btn-card-icon" onclick="openExternalUrl('${escapeHtml(app.url)}')" title="เปิดในแท็บเบราว์เซอร์ใหม่">
                  <i class="bi bi-box-arrow-up-right"></i>
                </button>
              </div>

              ${currentRole === 'admin' ? `
                <div class="admin-card-bar">
                  <button class="admin-pill-btn" onclick="openEditAppModal('${app.id}')">
                    <i class="bi bi-pencil-square"></i> แก้ไข
                  </button>
                  <button class="admin-pill-btn" onclick="toggleAppActive('${app.id}')">
                    <i class="bi ${isMaintenance ? 'bi-eye' : 'bi-eye-slash'}"></i> ${isMaintenance ? 'เปิด' : 'พัก'}
                  </button>
                  <button class="admin-pill-btn delete" onclick="confirmDeleteApp('${app.id}')">
                    <i class="bi bi-trash3"></i> ลบ
                  </button>
                </div>
              ` : ''}
            </div>
          </div>
        `;
      });

      html += '</div>';
      container.innerHTML = html;
    }

    // Icon Resolver helper
    function getAppIconSrc(app) {
      if (app.icon && app.icon.startsWith('http')) {
        return { isImg: true, src: app.icon };
      }
      if (app.icon && !app.icon.startsWith('http')) {
        return { isImg: false, src: app.icon };
      }
      return { isImg: false, src: '💧' };
    }

    function handleIconError(img, name) {
      img.outerHTML = `<span class="fallback-icon" style="font-size:1.5rem;">${name ? name.charAt(0).toUpperCase() : '💧'}</span>`;
    }

    function escapeHtml(text) {
      if (!text) return '';
      return String(text).replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    // ============================================================
    // IN-APP FULLSCREEN VIEWER (Without Browser Address Bar)
    // ============================================================
    function openInAppViewer(appId) {
      const apps = getStoredApps();
      const app = apps.find(a => a.id === appId);
      if (!app) return;

      currentViewerApp = app;

      const overlay = document.getElementById('viewerOverlay');
      const iframe = document.getElementById('viewerIframe');
      const title = document.getElementById('viewerAppTitle');
      const icon = document.getElementById('viewerAppIcon');
      const loader = document.getElementById('viewerLoader');

      title.textContent = app.name;
      
      const iconInfo = getAppIconSrc(app);
      if (iconInfo.isImg) {
        icon.src = iconInfo.src;
        icon.style.display = 'block';
      } else {
        icon.style.display = 'none';
      }

      loader.style.display = 'flex';
      loader.style.opacity = '1';

      overlay.classList.add('active');
      iframe.src = app.url;

      document.body.style.overflow = 'hidden';
    }

    function onIframeLoaded() {
      const loader = document.getElementById('viewerLoader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => { loader.style.display = 'none'; }, 300);
      }
    }

    function closeViewer() {
      const overlay = document.getElementById('viewerOverlay');
      const iframe = document.getElementById('viewerIframe');
      overlay.classList.remove('active');
      iframe.src = 'about:blank';
      document.body.style.overflow = '';
      currentViewerApp = null;
    }

    function reloadViewer() {
      const iframe = document.getElementById('viewerIframe');
      const loader = document.getElementById('viewerLoader');
      if (currentViewerApp && iframe) {
        loader.style.display = 'flex';
        loader.style.opacity = '1';
        iframe.src = currentViewerApp.url;
      }
    }

    function toggleViewerFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
      }
    }

    function openViewerExternal() {
      if (currentViewerApp && currentViewerApp.url) {
        window.open(currentViewerApp.url, '_blank');
      }
    }

    function openExternalUrl(url) {
      if (url) window.open(url, '_blank');
    }

    // ============================================================
    // SEARCH & FILTER
    // ============================================================
    function handleSearch(val) {
      searchQuery = (val || '').trim();
      const clearBtn = document.getElementById('searchClearBtn');
      if (clearBtn) {
        clearBtn.style.display = searchQuery ? 'block' : 'none';
      }
      renderApps();
    }

    function clearSearch() {
      const input = document.getElementById('searchInput');
      if (input) input.value = '';
      handleSearch('');
    }

    // ============================================================
    // APP MODAL (ADD / EDIT)
    // ============================================================
    function openAddAppModal() {
      if (currentRole !== 'admin') {
        openPinModal(() => {
          openAddAppModal();
        });
        return;
      }

      document.getElementById('appModalTitle').innerHTML = '<i class="bi bi-plus-circle" style="color: var(--water-primary);"></i> เพิ่มเว็บแอปใหม่';
      document.getElementById('formAppId').value = '';
      document.getElementById('formAppName').value = '';
      document.getElementById('formAppUrl').value = '';
      document.getElementById('formAppCategory').value = 'ทั่วไป';
      document.getElementById('formAppIcon').value = '';
      document.getElementById('formAppActive').checked = true;

      document.getElementById('appModal').classList.add('active');
    }

    function openEditAppModal(appId) {
      const apps = getStoredApps();
      const app = apps.find(a => a.id === appId);
      if (!app) return;

      document.getElementById('appModalTitle').innerHTML = '<i class="bi bi-pencil-square" style="color: var(--water-primary);"></i> แก้ไขเว็บแอป';
      document.getElementById('formAppId').value = app.id;
      document.getElementById('formAppName').value = app.name || '';
      document.getElementById('formAppUrl').value = app.url || '';
      document.getElementById('formAppCategory').value = app.category || 'ทั่วไป';
      document.getElementById('formAppIcon').value = app.icon || '';
      document.getElementById('formAppActive').checked = app.active !== false;

      document.getElementById('appModal').classList.add('active');
    }

    function closeAppModal() {
      document.getElementById('appModal').classList.remove('active');
    }

    function selectPresetIcon(iconEmoji) {
      document.getElementById('formAppIcon').value = iconEmoji;
    }

    async function handleAppFormSubmit(e) {
      e.preventDefault();
      const appId = document.getElementById('formAppId').value;
      const name = document.getElementById('formAppName').value.trim();
      const url = document.getElementById('formAppUrl').value.trim();
      const category = document.getElementById('formAppCategory').value.trim() || 'ทั่วไป';
      const icon = document.getElementById('formAppIcon').value.trim() || '💧';
      const active = document.getElementById('formAppActive').checked;

      if (!name || !url) {
        showToast('กรุณากรอกชื่อและ URL ให้ครบถ้วน');
        return;
      }

      closeAppModal();
      showLoader(appId ? 'กำลังบันทึกการแก้ไขลง Google Sheets...' : 'กำลังบันทึกแอปใหม่ลง Google Sheets...');

      let apps = getStoredApps();

      if (appId) {
        const index = apps.findIndex(a => a.id === appId);
        if (index !== -1) {
          apps[index] = { ...apps[index], name, url, category, icon, active };
        }
      } else {
        const newApp = {
          id: 'app-' + Date.now(),
          name,
          url,
          category,
          icon,
          active,
          order: apps.length + 1
        };
        apps.push(newApp);
      }

      await saveAppsToCloud(apps);
      hideLoader();
      showToast(appId ? 'บันทึกการแก้ไขเรียบร้อยแล้ว' : 'เพิ่มเว็บแอปสำเร็จแล้ว');
    }

    async function toggleAppActive(appId) {
      let apps = getStoredApps();
      const app = apps.find(a => a.id === appId);
      if (!app) return;

      showLoader('กำลังอัปเดตสถานะแอป...');
      app.active = !app.active;
      await saveAppsToCloud(apps);
      hideLoader();
      showToast(app.active ? 'เปิดใช้งานแอปแล้ว' : 'ปิดปรับปรุงชั่วคราว');
    }

    async function confirmDeleteApp(appId) {
      const apps = getStoredApps();
      const app = apps.find(a => a.id === appId);
      if (!app) return;

      if (confirm(`คุณต้องการลบเว็บแอป "${app.name}" หรือไม่?`)) {
        showLoader('กำลังลบข้อมูลจาก Google Sheets...');
        const updated = apps.filter(a => a.id !== appId);
        await saveAppsToCloud(updated);
        hideLoader();
        showToast('ลบเว็บแอปเรียบร้อยแล้ว');
      }
    }

    // ============================================================
    // ADMIN ROLE & PIN AUTHENTICATION
    // ============================================================
    let pinCallback = null;

    function toggleRole() {
      if (currentRole === 'admin') {
        currentRole = 'guest';
        updateRoleUI();
        renderApps();
        showToast('ออกจากโหมดแอดมินแล้ว');
      } else {
        openPinModal(() => {
          currentRole = 'admin';
          updateRoleUI();
          renderApps();
          showToast('เข้าสู่โหมดแอดมินสำเร็จ');
        });
      }
    }

    function updateRoleUI() {
      const roleBtn = document.getElementById('roleBtn');
      const roleText = document.getElementById('roleText');
      const roleIcon = document.getElementById('roleIcon');

      if (currentRole === 'admin') {
        roleBtn.classList.add('admin-active');
        roleText.textContent = 'โหมดแอดมิน';
        roleIcon.className = 'bi bi-shield-check';
      } else {
        roleBtn.classList.remove('admin-active');
        roleText.textContent = 'แอดมิน';
        roleIcon.className = 'bi bi-shield-lock';
      }
    }

    function openPinModal(onSuccess) {
      pinCallback = onSuccess;
      enteredPin = '';
      updatePinDots();
      document.getElementById('pinModal').classList.add('active');
    }

    function closePinModal() {
      document.getElementById('pinModal').classList.remove('active');
      enteredPin = '';
      pinCallback = null;
    }

    function pressPin(digit) {
      if (enteredPin.length < 4) {
        enteredPin += digit;
        updatePinDots();
        if (enteredPin.length === 4) {
          setTimeout(verifyPin, 150);
        }
      }
    }

    function clearPin() {
      enteredPin = '';
      updatePinDots();
    }

    function backspacePin() {
      if (enteredPin.length > 0) {
        enteredPin = enteredPin.slice(0, -1);
        updatePinDots();
      }
    }

    function updatePinDots() {
      for (let i = 0; i < 4; i++) {
        const dot = document.getElementById(`pinDot${i}`);
        if (dot) {
          if (i < enteredPin.length) {
            dot.classList.add('filled');
          } else {
            dot.classList.remove('filled');
          }
        }
      }
    }

    function verifyPin() {
      const targetPin = getAdminPin();
      if (enteredPin === targetPin) {
        const cb = pinCallback;
        closePinModal();
        if (cb) cb();
      } else {
        showToast('รหัส PIN ไม่ถูกต้อง (รหัสเริ่มต้นคือ 8055)');
        clearPin();
      }
    }

    // ============================================================
    // PWA & TOAST HELPERS
    // ============================================================
    function initPwaEvents() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.warn('SW registration skipped:', err);
        });
      }

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        const btn = document.getElementById('installPwaBtn');
        if (btn) btn.style.display = 'flex';
      });
    }

    function handlePwaInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          deferredPrompt = null;
          const btn = document.getElementById('installPwaBtn');
          if (btn) btn.style.display = 'none';
        });
      } else {
        showToast('แตะปุ่มแชร์ (Share) แล้วเลือก "เพิ่มไปยังหน้าจอโฮม" เพื่อติดตั้ง');
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      if (toast && toastMsg) {
        toastMsg.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => {
          toast.classList.remove('show');
        }, 2800);
      }
    }
  </script>
</body>
</html>
